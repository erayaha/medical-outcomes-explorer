name: Refresh public data snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 1 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn data:refresh
      - name: Commit refreshed data if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/2026-05/live-sample.json
          git diff --cached --quiet || git commit -m "chore: refresh public data snapshot"
          git push
